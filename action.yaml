name: "Podcast Generator"
author: "Sandeep Kumar"
description: "Generates a feed for a Podcast from a YAML file"
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: the coommiter's email address
    required: true
    default: ${{ github.actor }}@localhost
  name:
    description: the coommiter's name
    required: true
    default: ${{ github.actor }}@localhost